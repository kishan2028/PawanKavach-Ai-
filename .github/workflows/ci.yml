name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-and-test:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Static Code Analysis (Oxlint)
        run: npm run lint

      - name: Strict TypeScript Compilation
        run: npx tsc -b

      - name: Execute Vitest Test Suite (Tiers 1-5)
        run: npm run test:run

      - name: Production Bundle Compilation
        run: npm run build
